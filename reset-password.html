<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reset Password | Salt & Story</title>
<link rel="stylesheet" href="wordmark.css">
<style>
:root{--ink:#173844;--sea:#a8cdd7;--sea-soft:#eaf4f5;--sand:#c3a06b;--paper:#fffdfa;--line:rgba(23,56,68,.12);--muted:rgba(23,56,68,.62)}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f8f4ec,#fffdfa);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;min-height:100vh;display:grid;grid-template-rows:68px 1fr}.site-header{background:rgba(255,253,250,.98);border-bottom:1px solid var(--line)}.nav{width:min(1180px,calc(100% - 28px));height:68px;margin:0 auto;display:flex;align-items:center;justify-content:space-between}.brand img{width:184px;max-width:46vw}.back{font-size:.9rem;font-weight:800;text-decoration:none;color:var(--ink)}main{display:grid;place-items:center;padding:28px 14px}.card{width:min(100%,480px);background:white;border:1px solid var(--line);border-radius:24px;padding:30px}.eyebrow{font-size:.73rem;letter-spacing:.16em;text-transform:uppercase;font-weight:850;color:var(--sand)}h1{font-family:Georgia,"Times New Roman",serif;font-size:2.5rem;font-weight:400;line-height:1.08;margin:8px 0 10px}p{color:var(--muted);margin:0 0 22px}.field{display:grid;gap:7px;margin-bottom:14px}.field label{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;font-weight:850;color:var(--muted)}.field input{min-height:48px;border:1px solid rgba(23,56,68,.17);border-radius:12px;padding:12px 14px;font-size:16px}.btn{width:100%;min-height:52px;border:0;border-radius:999px;background:var(--ink);color:white;font-weight:800}.message{display:none;margin-top:16px;padding:12px;border-radius:12px;font-size:.85rem}.message.show{display:block}.message.error{background:#fbefef;color:#8a4747}.message.success{background:#edf7ef;color:#39684a}.loading{color:var(--muted);font-size:.9rem;margin-bottom:16px}@media(max-width:600px){.card{padding:24px 20px}.brand img{width:174px}}
</style>
</head>
<body>
<header class="site-header"><div class="nav"><a class="brand" href="./index.html"><img class="brand-wordmark" src="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 3 1%22%3E%3C/svg%3E" alt="Salt & Story"></a><a class="back" href="./login.html">Back to sign in</a></div></header>
<main><div class="card"><span class="eyebrow">Secure account</span><h1>Choose a new password.</h1><p>Use at least 8 characters. Once updated, you’ll return to the client sign-in page.</p><div class="loading" id="loading">Checking your reset link…</div><form id="resetForm" hidden><div class="field"><label for="password">New password</label><input id="password" type="password" minlength="8" required autocomplete="new-password"></div><div class="field"><label for="confirmPassword">Confirm password</label><input id="confirmPassword" type="password" minlength="8" required autocomplete="new-password"></div><button class="btn" id="resetButton" type="submit">Update Password</button></form><div class="message" id="message" role="status" aria-live="polite"></div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./auth.js"></script>
<script>
const db=window.saltStory,form=document.getElementById('resetForm'),loading=document.getElementById('loading'),message=document.getElementById('message');
function show(text,type='error'){message.className=`message show ${type}`;message.textContent=text}
(async()=>{await new Promise(r=>setTimeout(r,250));const {data}=await db.auth.getSession();if(!data.session){loading.textContent='This reset link is invalid or has expired.';show('Request a new password reset email from the sign-in page.','error');return}loading.hidden=true;form.hidden=false})();
form.addEventListener('submit',async e=>{e.preventDefault();const button=document.getElementById('resetButton'),password=document.getElementById('password').value,confirm=document.getElementById('confirmPassword').value;if(password.length<8){show('Use a password with at least 8 characters.','error');return}if(password!==confirm){show('The passwords do not match.','error');return}button.disabled=true;button.textContent='Updating…';const {error}=await db.auth.updateUser({password});if(error){show(error.message||'Unable to update the password.','error');button.disabled=false;button.textContent='Update Password';return}await db.auth.signOut();location.href='./login.html?reset=1'});
</script>
</body>
</html>
