name: Image Asset Build

on:
  push:
    branches: [main]
    paths:
      - '.asset-build/**'
      - '.github/workflows/image-asset-build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and verify high-resolution image assets
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, re

          jobs = [
              (
                  [f'.asset-build/whn.{i:02d}' for i in range(5)],
                  'assets/email/what-happens-next-email.jpg',
                  44511,
                  '09a5db9fc75ba0f30a16d2f42626e4d1331e3355a505ab16053ce5caa578a576',
              ),
              (
                  [f'.asset-build/pg70new.{i:02d}' for i in range(7)],
                  'assets/email/portal-guide-email.jpg',
                  46855,
                  '75041915dbc5e73d24a4c384f5ca89e6931599167bb968714bda2a20e4177d9a',
              ),
              (
                  ['.asset-build/hero.00', '.asset-build/hero.01', '.asset-build/hero.02', '.asset-build/hero.03', '.asset-build/hero.04a', '.asset-build/hero.04b', '.asset-build/hero.05'],
                  'assets/site-hero.webp',
                  41398,
                  'd29bf495112d4d4482487ce5f22b09c4885845b34854780133246546bb87aac6',
              ),
          ]

          for parts, dest, expected_size, expected_sha in jobs:
              encoded = ''.join(''.join(Path(p).read_text().split()) for p in parts)
              data = base64.b64decode(encoded, validate=True)
              digest = hashlib.sha256(data).hexdigest()
              if len(data) != expected_size:
                  raise SystemExit(f'{dest}: expected {expected_size} bytes, got {len(data)}')
              if digest != expected_sha:
                  raise SystemExit(f'{dest}: SHA256 mismatch {digest}')
              Path(dest).parent.mkdir(parents=True, exist_ok=True)
              Path(dest).write_bytes(data)
              print(f'Verified {dest}: {len(data)} bytes, {digest}')

          p = Path('hero.css')
          s = p.read_text()
          s2, n = re.subn(
              r':root\{--hero-art:url\("data:image/webp;base64,[A-Za-z0-9+/=]+"\);\}',
              ':root{--hero-art:url("assets/site-hero.webp");}',
              s,
              count=1,
          )
          if n != 1:
              raise SystemExit(f'Expected one hero-art data URI, replaced {n}')
          p.write_text(s2)
          PY

          rm -rf .asset-build
          rm -f .github/workflows/image-asset-build.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Upgrade email and site hero image quality"
          git push
