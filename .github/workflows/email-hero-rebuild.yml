name: Rebuild Email Hero Images

on:
  push:
    paths:
      - '.imageparts/READY'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Generate crisp Retina email heroes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from PIL import Image, ImageOps, ImageDraw, ImageFont
          import os

          src = Image.open('assets/site-hero.webp').convert('RGB')
          base = ImageOps.fit(src, (1200, 400), method=Image.Resampling.LANCZOS, centering=(0.5, 0.5))

          serif = '/usr/share/fonts/truetype/dejavu/DejaVuSerif.ttf'
          sans_bold = '/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          sans = '/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'

          def make(path, title, eyebrow):
              im = base.copy().convert('RGBA')
              # Dark coastal wash keeps white type readable while preserving the photography.
              overlay = Image.new('RGBA', im.size, (23, 56, 68, 92))
              im = Image.alpha_composite(im, overlay)
              draw = ImageDraw.Draw(im)

              logo_font = ImageFont.truetype(serif, 38)
              eyebrow_font = ImageFont.truetype(sans_bold, 24)
              title_font = ImageFont.truetype(sans_bold, 72)
              sub_font = ImageFont.truetype(sans, 22)

              draw.text((64, 48), 'Salt & Story', font=logo_font, fill=(255,255,255,255), stroke_width=1, stroke_fill=(23,56,68,120))
              draw.rounded_rectangle((64, 116, 255, 121), radius=2, fill=(217,154,105,255))
              draw.text((64, 145), eyebrow, font=eyebrow_font, fill=(242,231,213,255))
              draw.text((64, 185), title, font=title_font, fill=(255,255,255,255), stroke_width=1, stroke_fill=(23,56,68,150))
              draw.text((66, 302), 'Thoughtful details. Clear next steps.', font=sub_font, fill=(245,247,246,255))

              out = im.convert('RGB')
              out.save(path, 'JPEG', quality=92, subsampling=0, optimize=True)
              check = Image.open(path)
              check.load()
              assert check.size == (1200, 400), (path, check.size)
              assert os.path.getsize(path) > 90000, (path, os.path.getsize(path))
              print(path, check.size, os.path.getsize(path))

          make('assets/email/what-happens-next-email.jpg', 'WHAT HAPPENS NEXT', 'YOUR SALT & STORY JOURNEY')
          make('assets/email/portal-guide-email.jpg', 'YOUR PORTAL GUIDE', 'YOUR PROJECT WORKSPACE')
          PY

      - name: Commit rebuilt images and clean staging
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .imageparts
          rm -f .github/workflows/email-hero-rebuild.yml
          git add -A
          git commit -m "Rebuild crisp Retina email hero images"
          git push
