name: Enhance Email Hero Images

on:
  push:
    paths:
      - '.imageparts/READY'

permissions:
  contents: write

jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Repair, upscale and sharpen email heroes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from PIL import Image, ImageFilter, ImageFile
          import os

          ImageFile.LOAD_TRUNCATED_IMAGES = True

          files = [
              'assets/email/what-happens-next-email.jpg',
              'assets/email/portal-guide-email.jpg',
          ]

          for path in files:
              im = Image.open(path).convert('RGB')
              im = im.resize((1200, 400), Image.Resampling.LANCZOS)
              im = im.filter(ImageFilter.UnsharpMask(radius=1.2, percent=150, threshold=2))
              im.save(path, 'JPEG', quality=92, subsampling=0, optimize=True)
              check = Image.open(path)
              check.load()
              assert check.size == (1200, 400), (path, check.size)
              assert os.path.getsize(path) > 120000, (path, os.path.getsize(path))
              print(path, check.size, os.path.getsize(path))
          PY

      - name: Commit enhanced images and clean staging
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .imageparts
          rm -f .github/workflows/email-hero-rebuild.yml
          git add -A
          git commit -m "Repair and sharpen Retina email hero images"
          git push
